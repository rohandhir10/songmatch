name: Lyrics coverage

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/lyrics-coverage.mjs --write
      - run: |
          if git diff --quiet lib/lyricsCoverage.json; then
            echo "coverage unchanged"
          else
            git config user.name "songmatch-bot"
            git config user.email "songmatch-bot@users.noreply.github.com"
            git add lib/lyricsCoverage.json
            git commit -m "Refresh lyrics coverage audit"
            git push
          fi
